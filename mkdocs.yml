markdown_extensions:
  - pymdownx.superfences
theme:
  name: material
  palette:
    primary: 'custom'
    accent: 'red'
  font:
    text: Arial
    code: Consolas
  custom_dir: overrides
  features:
    - navigation.indexes
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.prune
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.annotate
    - content.code.copy
    - content.code.expand
    - content.tabs.link
extra_css:
  - stylesheets/bzk.css