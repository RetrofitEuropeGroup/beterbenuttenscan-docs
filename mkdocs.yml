site_name: Beter Benutten Scan documentatie
site_url: https://retrofiteuropegroup.github.io/beterbenuttenscan-docs/
repo_url: https://github.com/RetrofitEuropeGroup/beterbenuttenscan-docs
repo_name: RetrofitEuropeGroup/beterbenuttenscan-docs
nav:
  - Algemeen:
      - algemeen/index.md
      - Introductie: algemeen/introductie.md
      - PIM platform: algemeen/piminfo.md
      - Ondersteuning: algemeen/ondersteuning.md
  - Ambitie bepalen: ambitie-bepalen/index.md
  - Ambitie vastleggen: ambitie-vastleggen/index.md
  - Beleid uitvoeren: beleid-uitvoeren/index.md
  - Voortgang monitoren: monitoren/index.md
  - Technische documentatie:
      - Gebouwtypes:
          - Appartementencomplexen: beterbenuttenscan/gebouwtypes/appartementencomplexen.md
          - Hoekwoningen: beterbenuttenscan/gebouwtypes/hoekwoningen.md
      - Filteren: beterbenuttenscan/filteren.md
      - Wegen: beterbenuttenscan/wegen/index.md
      - Analyseren:
          - BeterBenuttenScan: beterbenuttenscan/analyseren/beterbenuttenscan.md
          - Mobiliteit: beterbenuttenscan/analyseren/mobiliteit.md
          - Voorzieningen: beterbenuttenscan/analyseren/voorzieningen.md
          - Regelgeving: beterbenuttenscan/analyseren/regelgeving.md
          - Verstedelijking: beterbenuttenscan/analyseren/verstedelijking.md
          - Ondergrond: beterbenuttenscan/analyseren/ondergrond.md
          - Eigendomsinformatie: beterbenuttenscan/analyseren/eigendomsinformatie.md
          - Energietransitie: beterbenuttenscan/analyseren/energietransitie.md
          - Street view: beterbenuttenscan/analyseren/street-view.md
      - Exporteren: beterbenuttenscan/exporteren.md
      - Voorbeeld user story: beterbenuttenscan/voorbeeld-user-story.md
markdown_extensions:
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
plugins:
  - search
  - git-revision-date-localized:
      type: datetime
      locale: nl
      timezone: Europe/Amsterdam
      fallback_to_build_date: false
  - git-committers:
      repository: RetrofitEuropeGroup/beterbenuttenscan-docs
      branch: main
theme:
  name: material
  language: nl
  palette:
    primary: 'custom'
    accent: 'red'
  font:
    text: Arial
    code: Consolas
  custom_dir: overrides
  features:
    - navigation.indexes
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.prune
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.annotate
    - content.code.copy
    - content.code.expand
    - content.tabs.link
extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/scan-button.js