site_name: Beter Benutten Scan documentatie
site_url: https://verdichtingswijzer.nl
repo_url: https://github.com/RetrofitEuropeGroup/beterbenuttenscan-docs
repo_name: RetrofitEuropeGroup/beterbenuttenscan-docs
nav:
  - Algemeen:
      - algemeen/index.md
      - Introductie: algemeen/introductie.md
      - Aanmelden: algemeen/aanmelden.md
      - PIM platform: algemeen/piminfo.md
      - Ondersteuning: algemeen/ondersteuning.md
  - Gebruikshandleiding:
    - gebruikshandleiding/index.md
    - 1. Ambitie bepalen: gebruikshandleiding/ambitie-bepalen.md
    - 2. Ambitie vastleggen: gebruikshandleiding/ambitie-vastleggen.md
    - 3. Beleid uitvoeren: gebruikshandleiding/beleid-uitvoeren.md
    - 4. Monitoren: gebruikshandleiding/monitoren.md
  - Technische documentatie:
      - technische-documentatie/index.md
      - Gebiedslagen: technische-documentatie/gebiedslagen.md
      - Objectlagen:
          - Appartementencomplexen: technische-documentatie/objectlagen/appartementencomplexen.md
          - Hoekwoningen: technische-documentatie/objectlagen/hoekwoningen.md
      - Analyselagen: technische-documentatie/analyselagen.md
      - Functionaliteiten: technische-documentatie/functionaliteiten.md

markdown_extensions:
  - admonition
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
plugins:
  - search
  - glightbox
  - git-revision-date-localized:
      type: datetime
      locale: nl
      timezone: Europe/Amsterdam
      fallback_to_build_date: false
  - git-committers:
      repository: RetrofitEuropeGroup/beterbenuttenscan-docs
      branch: main
theme:
  name: material
  language: nl
  palette:
    primary: 'custom'
    accent: 'red'
  font:
    text: Arial
    code: Consolas
  custom_dir: overrides
  features:
    - navigation.indexes
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.footer
    - navigation.prune
    - navigation.tracking
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.annotate
    - content.code.copy
    - content.code.expand
    - content.tabs.link
extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/scan-button.js